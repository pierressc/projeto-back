services:
  mysql:
    image: mysql:8.4
    container_name: central-encomendas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-central_encomendas}
      MYSQL_USER: ${DB_USER:-encomendas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-encomendas_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
